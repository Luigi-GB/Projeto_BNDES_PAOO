spring.application.name=BNDES_PAOO

spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Importação de CSV do BNDES ---
# O CSV do BNDES tem ~20 MB; deixamos folga para arquivos maiores
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# true  -> padroniza textos sem acentos (ex.: "MÉDIA" vira "MEDIA")
# false -> mantém os acentos, só tira espaços e coloca em maiúsculas
importacao.remover-acentos=true